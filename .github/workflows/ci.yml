name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap and toolchain-free, so it runs alongside the lint job rather than
  # behind it: a broken TOC is worth hearing about even if luacheck is red.
  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the TOC file list and load order
        run: sh .github/scripts/validate-toc.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck
        run: luacheck .
