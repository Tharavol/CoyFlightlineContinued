name: Release

on:
  push:
    tags:
      - "v*"
  # Manual re-run against an existing tag, for when the tag push itself never
  # triggered a run (e.g. an Actions outage) -- run against the tag ref rather
  # than re-pushing it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v1.1.1)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Set these repository secrets to publish automatically;
          # without them the packager just attaches the zip to the GitHub
          # release. CF_API_KEY additionally needs ## X-Curse-Project-ID in
          # the .toc.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
