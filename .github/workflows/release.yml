name: Release

on:
  push:
    tags:
      # Stable releases only -- v1.2.0-alpha.1 etc. go through prerelease.yml
      # instead, so the two workflows never both fire on the same tag.
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Manual re-run against an existing tag, for when the tag push itself never
  # triggered a run (e.g. an Actions outage) -- run against the tag ref rather
  # than re-pushing it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v1.1.1)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # CF_API_KEY alone is not enough for the packager to upload to CurseForge;
      # it also needs ## X-Curse-Project-ID in the .toc. Without that field the
      # packager just skips the CurseForge upload silently -- no error, no log
      # line -- and the release "succeeds" with only the GitHub zip attached.
      # Catch that mismatch here instead of on release day. See issue #7 for
      # the (still open) decision on publishing under our own CurseForge project.
      - name: Guard against silent CurseForge no-op
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -n "$CF_API_KEY" ] && ! grep -q '^## X-Curse-Project-ID:' CoyFlightline.toc; then
            echo "::error::CF_API_KEY is set but CoyFlightline.toc has no X-Curse-Project-ID -- the CurseForge upload would silently no-op. Add the field or remove the CF_API_KEY secret." >&2
            exit 1
          fi

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Set these repository secrets to publish automatically;
          # without them the packager just attaches the zip to the GitHub
          # release. CF_API_KEY additionally needs ## X-Curse-Project-ID in
          # the .toc -- see the guard step above.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      # CI's dry-run build verifies layout too, but it skips itself on this
      # exact commit (see ci.yml) since packager won't double-build a tagged
      # commit. This is the only place the archive that actually ships gets
      # checked.
      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'CoyFlightline/CoyFlightline.toc'
          unzip -l "$zip" | grep -q 'CoyFlightline/Core.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/Config.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/Minimap.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/WorldMap.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/Settings.lua'

          # Dev-only tooling / docs; .pkgmeta ignores them, and they should stay ignored.
          # A bare `!` here would be exempt from set -e and silently not fail.
          if unzip -l "$zip" | grep -q 'CoyFlightline/spec/'; then
            echo "spec/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
          if unzip -l "$zip" | grep -q 'CoyFlightline/CHANGELOG.md'; then
            echo "CHANGELOG.md should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
