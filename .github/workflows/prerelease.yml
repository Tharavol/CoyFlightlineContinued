name: Pre-release

on:
  push:
    tags:
      # alpha/beta only: packager itself reads "alpha"/"beta" out of the tag
      # name to decide the GitHub release's prerelease flag (and, later, the
      # CurseForge release channel), so tags need one of those words in them
      # to get that treatment. Anything else (e.g. -rc.1) would still build
      # and publish here, just without that automatic classification.
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"
  # Manual re-run against an existing tag, for when the tag push itself never
  # triggered a run (e.g. an Actions outage) -- run against the tag ref rather
  # than re-pushing it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing pre-release tag to package (e.g. v1.2.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # No CF_API_KEY here, deliberately -- this channel only ever attaches a
      # build to a GitHub release plus, if configured, WoWInterface/Wago.
      # If release.yml gains CurseForge publishing later, this job still
      # won't touch it, since packager only uploads to a destination when
      # its token env var is present.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'CoyFlightline/CoyFlightline.toc'
          unzip -l "$zip" | grep -q 'CoyFlightline/Core.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/Config.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/Minimap.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/WorldMap.lua'
          unzip -l "$zip" | grep -q 'CoyFlightline/Settings.lua'

          if unzip -l "$zip" | grep -q 'CoyFlightline/spec/'; then
            echo "spec/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
          if unzip -l "$zip" | grep -q 'CoyFlightline/CHANGELOG.md'; then
            echo "CHANGELOG.md should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
